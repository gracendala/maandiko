name: Build MaAndiko Remote APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-remote-apk:
    name: Build MaAndiko Remote Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies for Remote App
        run: |
          cd remote-app
          npm install

      - name: Build Web Application for Remote
        run: |
          cd remote-app
          npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          cd remote-app
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd remote-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Remote APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaAndiko-Remote-APK
          path: remote-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
